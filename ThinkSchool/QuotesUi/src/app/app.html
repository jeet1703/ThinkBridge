<main>
  <h1>{{ title() }}</h1>

  <nav class="tabs">
    <button
      type="button"
      class="tabs__btn"
      [class.tabs__btn--active]="activeTab() === 'quotes'"
      (click)="selectTab('quotes')"
    >
      Quotes
    </button>
    <button
      type="button"
      class="tabs__btn"
      [class.tabs__btn--active]="activeTab() === 'authors'"
      (click)="selectTab('authors')"
    >
      Authors
    </button>
  </nav>

  @switch (activeTab()) {
    @case ('authors') {
      <app-authors-list />
    }
    @default {
      <app-quotes-list />
    }
  }
</main>
