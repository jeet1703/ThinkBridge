name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore OrderRefactor/Refactored/Refactored.csproj

    - name: Build
      run: dotnet build OrderRefactor/Refactored/Refactored.csproj --no-restore

    - name: Test
      run: dotnet test OrderRefactor/Refactored/Refactored.csproj --no-build --verbosity normal
