name: CI

on:
  push:
    branches: [ main, day-3-piece-3 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Day3/piece3/QuotesApi/QuotesApi.slnx

    - name: Build
      run: dotnet build Day3/piece3/QuotesApi/QuotesApi.slnx --no-restore

    - name: Run Tests (Unit + Integration with Testcontainers SQL Server)
      run: dotnet test Day3/piece3/QuotesApi/QuotesApi.slnx --no-build --verbosity normal
