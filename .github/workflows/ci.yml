name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ThinkSchool/QuotesApi/QuotesApi.slnx

    - name: Build
      run: dotnet build ThinkSchool/QuotesApi/QuotesApi.slnx --no-restore

    - name: Run Tests
      run: dotnet test ThinkSchool/QuotesApi/QuotesApi.slnx --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]*.Migrations.*"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/test-results.trx"

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: "**/coverage.cobertura.xml"

    - name: Check Code Coverage Threshold
      shell: pwsh
      run: |
        $files = Get-ChildItem -Recurse -Filter coverage.cobertura.xml
        if ($files.Count -eq 0) {
            Write-Error "No coverage files found."
            exit 1
        }
        
        $lines = @{}
        foreach ($file in $files) {
            Write-Host "Parsing coverage file: $($file.FullName)"
            [xml]$xml = Get-Content $file.FullName
            $classes = $xml.SelectNodes("//class")
            foreach ($class in $classes) {
                $className = $class.name
                if ($className -like "*Migrations*") { continue }
                if (-not $lines.Contains($className)) {
                    $lines[$className] = @{}
                }
                foreach ($line in $class.SelectNodes(".//line")) {
                    $num = [int]$line.number
                    $hits = [int]$line.hits
                    $prevHits = if ($lines[$className].Contains($num)) { $lines[$className][$num] } else { 0 }
                    $lines[$className][$num] = [Math]::Max($prevHits, $hits)
                }
            }
        }
        
        $totalLines = 0
        $coveredLines = 0
        foreach ($className in $lines.Keys) {
            foreach ($num in $lines[$className].Keys) {
                $totalLines++
                if ($lines[$className][$num] -gt 0) {
                    $coveredLines++
                }
            }
        }
        
        if ($totalLines -eq 0) {
            Write-Error "No valid lines found in code coverage."
            exit 1
        }
        
        $coverage = ($coveredLines / $totalLines) * 100
        $rounded = [Math]::Round($coverage, 2)
        Write-Host "Total Valid Lines: $totalLines"
        Write-Host "Total Covered Lines: $coveredLines"
        Write-Host "Combined Code Coverage: $rounded%"
        
        if ($coverage -lt 70.0) {
            Write-Error "Code coverage is $rounded%, which is below the 70% threshold."
            exit 1
        } else {
            Write-Host "Code coverage threshold check passed."
        }
